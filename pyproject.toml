[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Backend deps
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "libtmux>=0.31",
    "haloant_kit",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Gateway deps
    "aiosqlite>=0.19",
    "lark-oapi>=1.3",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # CLI
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
]

[project.scripts]
agentgate-gateway = "agentgate_gateway.main:main"
agentgate-backend = "agentgate_backend.main:main"
agentgate-ctl = "agentgate_ctl.main:cli"
echo-backend = "echo_backend.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agentgate_backend*", "agentgate_ctl*", "agentgate_gateway*", "echo_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
